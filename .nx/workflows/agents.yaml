launch-templates:
  gtkx-linux-large:
    resource-class: docker_linux_amd64/large
    image: ghcr.io/gtkx-org/gtkx-ci:ubuntu26-v1
    no-output-timeout: 30m
    init-steps:
      - name: Checkout
        uses: https://raw.githubusercontent.com/nrwl/nx-cloud-workflows/563df6a963147063d44d830a2ec7f117758d6c41/workflow-steps/checkout/main.yaml
      - name: Restore dependency downloads
        uses: https://raw.githubusercontent.com/nrwl/nx-cloud-workflows/563df6a963147063d44d830a2ec7f117758d6c41/workflow-steps/cache/main.yaml
        inputs:
          key: '"gtkx-agent"|.nx/workflows/agents.yaml|pnpm-lock.yaml|packages/native/Cargo.lock'
          paths: |
            .pnpm-store
            packages/native/target
          base-branch: main
      - name: Install workspace dependencies
        script: pnpm install --frozen-lockfile --store-dir .pnpm-store
