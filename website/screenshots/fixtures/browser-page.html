<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>GTKX — Native Linux application development for the modern age</title>
        <style>
            :root {
                color-scheme: light;
            }
            * {
                margin: 0;
                box-sizing: border-box;
            }
            body {
                font-family: "Cantarell", "Noto Sans", sans-serif;
                background: #faf8f5;
                color: #15161b;
                min-height: 100vh;
                display: grid;
                place-items: center;
            }
            main {
                text-align: center;
                padding: 48px;
                max-width: 720px;
            }
            .mark {
                width: 72px;
                height: 72px;
                margin: 0 auto 24px;
                border-radius: 18px;
                background: linear-gradient(135deg, #e03a3e, #b81c25);
                display: grid;
                place-items: center;
                color: #fff;
                font-size: 30px;
                font-weight: 800;
                letter-spacing: -1px;
            }
            h1 {
                font-size: 40px;
                font-weight: 800;
                letter-spacing: -0.5px;
                line-height: 1.15;
            }
            h1 span {
                color: #c8102e;
            }
            p {
                margin-top: 16px;
                font-size: 18px;
                color: #5a5c66;
                line-height: 1.5;
            }
            .install {
                margin-top: 28px;
                display: inline-block;
                background: #15161b;
                color: #e8e6e3;
                font-family: "Source Code Pro", monospace;
                font-size: 15px;
                padding: 12px 20px;
                border-radius: 10px;
            }
            .install b {
                color: #7fdca4;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="mark">GX</div>
            <h1>Native Linux application development <span>for the modern age</span></h1>
            <p>React 19 renders to real GTK4 and Libadwaita widgets on Node.js — no Electron, no WebView.</p>
            <div class="install"><b>$</b> npx @gtkx/cli@latest create my-app</div>
        </main>
    </body>
</html>
