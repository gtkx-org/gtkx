id: com.gtkx.tutorial
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: gtkx-tutorial
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    npm_config_nodedir: /usr/lib/sdk/node24
  no-debuginfo: true
  # The SEA blob is appended to the node binary as an ELF section; stripping
  # it would corrupt the embedded application, so leave the binary unstripped.
  strip: false

modules:
  - name: gtkx-tutorial
    buildsystem: simple
    build-options:
      env:
        npm_config_offline: "true"
        npm_config_cache: /run/build/gtkx-tutorial/flatpak-node/npm-cache
        XDG_CACHE_HOME: /run/build/gtkx-tutorial/flatpak-node/cache
        ESBUILD_BINARY_PATH: /run/build/gtkx-tutorial/flatpak-node/cache/esbuild/bin/esbuild-current
    build-commands:
      - cd examples/tutorial && npm ci --offline
      - cd examples/tutorial && npm run bundle
      - cd examples/tutorial && npm run bundle:postject
      - cd examples/tutorial && node --experimental-sea-config sea-config.json
      - cd examples/tutorial && cp /usr/lib/sdk/node24/bin/node app
      - cd examples/tutorial && node vendor/postject.cjs app NODE_SEA_BLOB dist/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
      - install -Dm755 examples/tutorial/app /app/bin/gtkx-tutorial
      - install -Dm755 examples/tutorial/dist/gtkx.node /app/bin/gtkx.node
      - install -Dm644 examples/tutorial/data/com.gtkx.tutorial.gschema.xml /app/share/glib-2.0/schemas/com.gtkx.tutorial.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
      - install -Dm644 examples/tutorial/flatpak/com.gtkx.tutorial.desktop /app/share/applications/com.gtkx.tutorial.desktop
      - install -Dm644 examples/tutorial/flatpak/com.gtkx.tutorial.metainfo.xml /app/share/metainfo/com.gtkx.tutorial.metainfo.xml
      - install -Dm644 examples/tutorial/assets/icon.png /app/share/icons/hicolor/256x256/apps/com.gtkx.tutorial.png
    sources:
      - type: git
        url: https://github.com/gtkx-org/gtkx.git
        commit: 0000000000000000000000000000000000000000
      # Standalone overrides for the app subdir: published-version deps, a
      # self-contained tsconfig, and a config that lets `gtkx build` generate
      # the @gtkx/gi bindings in-sandbox from the runtime GIR data.
      - type: file
        path: package.json
        dest: examples/tutorial
      - type: file
        path: package-lock.json
        dest: examples/tutorial
      - type: file
        path: tsconfig.json
        dest: examples/tutorial
      - type: file
        path: gtkx.config.ts
        dest: examples/tutorial
      - generated-sources.json
