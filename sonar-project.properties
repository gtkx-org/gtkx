sonar.projectKey=gtkx-org_gtkx
sonar.organization=gtkx-org
sonar.scm.provider=git

sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=**/generated/**,**/dist/**,**/out-tsc/**,**/node_modules/**,**/target/**,**/.turbo/**,**/index.node,**/girs/**

sonar.coverage.exclusions=packages/*/bin/**,packages/vitest/src/**,packages/cli/src/mcp-client.ts,packages/codegen/overlay/**
sonar.cpd.exclusions=**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,packages/codegen/overlay/**

sonar.typescript.tsconfigPaths=tsconfig.json
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
