[package]
name = "test-support"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
doctest = false

[lints.rust]
elided_lifetimes_in_paths = "warn"
trivial_casts = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
missing_safety_doc = "allow"
not_unsafe_ptr_arg_deref = "allow"

[dependencies]
native = { path = ".." }
napi = { version = "3", features = ["napi8"] }
gtk4 = "0.11.4"
anyhow = "1.0.104"
