[package]
name = "native"
version = "0.0.0"
authors = ["Eugenio Depalo <eugeniodepalo@gmail.com>"]
license = "MPL-2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
glib = { version = "0.22", features = ["v2_68"] }
libloading = "0.9.0"
libffi = "5.1.1"
anyhow = "1.0.104"
enum_dispatch = "0.3"

[build-dependencies]
napi-build = "2"

[lints.clippy]
missing_safety_doc = "allow"

[dev-dependencies]
gtk4 = "0.11.4"
napi = { version = "3", features = ["napi8"] }
test-support = { path = "test-support" }
