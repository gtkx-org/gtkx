[package]
name = "native"
version = "0.0.0"
authors = ["Eugenio Depalo <eugeniodepalo@gmail.com>"]
license = "MPL-2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
glib = { version = "0.22", features = ["v2_68"] }
libloading = "0.9.0"
libffi = "5.2.0"
anyhow = "1.0.104"
enum_dispatch = "0.3"

[build-dependencies]
napi-build = "2"

[lints.rust]
elided_lifetimes_in_paths = "warn"
trivial_casts = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
type_complexity = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
