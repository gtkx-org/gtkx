name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_WRITE_TOKEN || secrets.NX_READ_TOKEN }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      CAN_PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        if: &can-push env.CAN_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for the image in GHCR
        id: existing
        shell: bash
        env:
          REF: ghcr.io/gtkx-org/gtkx-ci:df-${{ hashFiles('.github/docker/**') }}
        run: |
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "result=present" >> "$GITHUB_OUTPUT"
          else
            echo "result=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: &image-missing steps.existing.outputs.result == 'missing'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push CI image by digest
        id: build
        if: *image-missing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/docker
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/gtkx-org/gtkx-ci,push-by-digest=true,name-canonical=true,push=${{ env.CAN_PUSH }}
          cache-from: type=gha,scope=ci-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-image-${{ matrix.arch }}

      - name: Export the digest
        if: &image-pushed steps.existing.outputs.result == 'missing' && env.CAN_PUSH == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        if: *image-pushed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      CAN_PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image tags
        id: meta
        run: |
          ref="ghcr.io/gtkx-org/gtkx-ci:df-${{ hashFiles('.github/docker/**') }}"
          tags="--tag $ref"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="$tags --tag ghcr.io/gtkx-org/gtkx-ci:latest"
          fi
          {
            echo "ref=$ref"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: *can-push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for the image in GHCR
        id: existing
        shell: bash
        env:
          REF: ${{ steps.meta.outputs.ref }}
        run: |
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "result=present" >> "$GITHUB_OUTPUT"
          else
            echo "result=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the per-arch digests
        if: &manifest-missing steps.existing.outputs.result == 'missing' && env.CAN_PUSH == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-image-digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Merge the digests into a multi-arch manifest list
        if: *manifest-missing
        shell: bash
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REF: ${{ steps.meta.outputs.ref }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $TAGS \
            $(printf 'ghcr.io/gtkx-org/gtkx-ci@sha256:%s ' *)
          docker buildx imagetools inspect "$REF"

      - name: Point the latest tag at the existing image
        if: steps.existing.outputs.result == 'present' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          REF: ${{ steps.meta.outputs.ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag ghcr.io/gtkx-org/gtkx-ci:latest "$REF"

  lint:
    needs: [changes, image-manifest]
    if: &code-changed needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm lint
          image-ref: ${{ needs.image-manifest.outputs.ref }}

      - name: Report failures to Nx Cloud
        if: &fix-ci always() && env.NX_CLOUD_ACCESS_TOKEN != ''
        continue-on-error: true
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm exec nx fix-ci
          install: "false"

  test:
    needs: [changes, image-manifest]
    if: *code-changed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm test
          image-ref: ${{ needs.image-manifest.outputs.ref }}

      - name: Report failures to Nx Cloud
        if: *fix-ci
        continue-on-error: true
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm exec nx fix-ci
          install: "false"

  asan:
    needs: [changes, image-manifest]
    if: *code-changed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the end-to-end suite under AddressSanitizer
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm exec nx run @gtkx/e2e:test:asan
          image-ref: ${{ needs.image-manifest.outputs.ref }}

  typecheck:
    needs: [changes, image-manifest]
    if: *code-changed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Typecheck
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm typecheck
          image-ref: ${{ needs.image-manifest.outputs.ref }}

      - name: Report failures to Nx Cloud
        if: *fix-ci
        continue-on-error: true
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm exec nx fix-ci
          install: "false"

  publish-e2e:
    needs: [changes, image-manifest]
    if: *code-changed
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish to Verdaccio, then scaffold, build, and test a consumer app
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm release-e2e
          image-ref: ${{ needs.image-manifest.outputs.ref }}

      - name: Publish to Verdaccio, then install, build, and run the tutorial app
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm tutorial
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  gir:
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Extract the project's GTK 4.22 GIR closure
        shell: bash
        run: |
          mkdir -p gir
          docker run --rm -v "$PWD/gir:/gir" ubuntu:26.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            codename=$(. /etc/os-release; echo "$VERSION_CODENAME")
            for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              if [ -e "$sources" ]; then
                sed -i "s|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g" "$sources"
              fi
            done
            grep -rq "azure.archive.ubuntu.com" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null
            printf "deb http://azure.archive.ubuntu.com/ubuntu %s-proposed main\n" "$codename" > /etc/apt/sources.list.d/proposed.list
            printf "Package: *\nPin: release a=%s-proposed\nPin-Priority: 100\n\nPackage: src:gtk4\nPin: release a=%s-proposed\nPin-Priority: 600\n" "$codename" "$codename" > /etc/apt/preferences.d/gtk4-proposed
            apt-get update -qq
            apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev gobject-introspection libgirepository1.0-dev >/dev/null
            cp /usr/share/gir-1.0/*.gir /gir/
          '
          echo "GIR files: $(find gir -type f -name '*.gir' | wc -l)"

      - name: Upload the GIR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gtk-gir
          path: gir/
          retention-days: 1

  bench:
    needs: [changes, gir]
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: codspeed-macro
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe runner
        shell: bash
        run: |
          uname -m
          . /etc/os-release && echo "$PRETTY_NAME"

      - name: Install the GTK4 runtime and headless compositor
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev \
            libgirepository1.0-dev gobject-introspection \
            gvfs libgles2 libgl1-mesa-dri \
            dbus \
            adwaita-icon-theme gsettings-desktop-schemas shared-mime-info \
            hicolor-icon-theme librsvg2-common \
            fontconfig fonts-noto-core fonts-dejavu-core \
            util-linux libglib2.0-bin
          pkg-config --modversion gtk4

      - name: Download the matching GTK 4.22 GIR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gtk-gir
          path: ${{ runner.temp }}/gir

      - name: Point codegen at the downloaded GIR
        shell: bash
        run: echo "GTKX_GIR_PATH=$RUNNER_TEMP/gir" >> "$GITHUB_ENV"

      - name: Restore the headless sway build
        id: sway
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/sway
          key: &sway-key sway-1.10.1-wlroots-0.18.2-deps-r4-${{ runner.os }}-${{ runner.arch }}

      - name: Build sway with the headless backend
        if: steps.sway.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3-pip pkg-config cmake \
            libpixman-1-dev libxkbcommon-dev libudev-dev libevdev-dev libmtdev-dev \
            libdbus-1-dev libcairo2-dev libpango1.0-dev libglib2.0-dev \
            libpng-dev libjson-c-dev libpcre2-dev scdoc hwdata bison
          sudo pip3 install --quiet "meson>=1.3"

          PREFIX=/opt/sway
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export LD_LIBRARY_PATH="$PREFIX/lib:${LD_LIBRARY_PATH:-}"
          export CPPFLAGS="-I$PREFIX/include"

          build() {
            local url="$1" dir="$2"
            shift 2
            curl -fsSL "$url" -o "$RUNNER_TEMP/src.tar"
            tar -xf "$RUNNER_TEMP/src.tar" -C "$RUNNER_TEMP"
            meson setup "$RUNNER_TEMP/$dir/build" "$RUNNER_TEMP/$dir" \
              --prefix="$PREFIX" --libdir=lib --buildtype=release "$@"
            ninja -C "$RUNNER_TEMP/$dir/build" install
          }

          build \
            "https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.23.1/downloads/wayland-1.23.1.tar.xz" \
            "wayland-1.23.1" -Dtests=false -Ddocumentation=false -Ddtd_validation=false
          build \
            "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.36/downloads/wayland-protocols-1.36.tar.xz" \
            "wayland-protocols-1.36" -Dtests=false
          build \
            "https://dri.freedesktop.org/libdrm/libdrm-2.4.125.tar.xz" \
            "libdrm-2.4.125" -Dtests=false -Dcairo-tests=disabled -Dman-pages=disabled \
            -Dvalgrind=disabled -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled \
            -Dnouveau=disabled -Dvmwgfx=disabled
          build \
            "https://gitlab.freedesktop.org/emersion/libdisplay-info/-/releases/0.2.0/downloads/libdisplay-info-0.2.0.tar.xz" \
            "libdisplay-info-0.2.0"

          build \
            "https://www.cairographics.org/releases/pixman-0.42.2.tar.gz" \
            "pixman-0.42.2"
          build \
            "https://xkbcommon.org/download/libxkbcommon-1.7.0.tar.xz" \
            "libxkbcommon-1.7.0" -Denable-docs=false -Denable-tools=false \
            -Denable-wayland=false -Denable-x11=false -Denable-xkbregistry=false \
            -Denable-bash-completion=false

          build \
            "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.26.1/libinput-1.26.1.tar.gz" \
            "libinput-1.26.1" -Dlibwacom=false -Ddebug-gui=false -Dtests=false \
            -Ddocumentation=false

          build \
            "https://gitlab.freedesktop.org/wlroots/wlroots/-/releases/0.18.2/downloads/wlroots-0.18.2.tar.gz" \
            "wlroots-0.18.2" -Dbackends= -Dxwayland=disabled -Dsession=disabled -Dexamples=false
          build \
            "https://github.com/swaywm/sway/releases/download/1.10.1/sway-1.10.1.tar.gz" \
            "sway-1.10.1" -Dtray=disabled -Dman-pages=disabled -Dgdk-pixbuf=disabled \
            -Dswaybar=false -Dswaynag=false -Ddefault-wallpaper=false \
            -Dzsh-completions=false -Dbash-completions=false -Dfish-completions=false

      - name: Save the headless sway build
        if: steps.sway.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/sway
          key: *sway-key

      - name: Put the headless sway on PATH
        shell: bash
        run: |
          echo "/opt/sway/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/sway/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="/opt/sway/lib:${LD_LIBRARY_PATH:-}" /opt/sway/bin/sway --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Set up Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run the TypeScript benchmarks under CodSpeed
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          run: pnpm bench
