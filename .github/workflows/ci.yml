name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compute image tags
        id: meta
        run: |
          ref="ghcr.io/gtkx-org/gtkx-ci:df-${{ hashFiles('.github/docker/**') }}"
          tags="$ref"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags=$(printf '%s\n%s' "$ref" "ghcr.io/gtkx-org/gtkx-ci:latest")
          fi
          {
            echo "ref=$ref"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/docker
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image

  lint:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Lint
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm lint
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  test:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Run tests
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm test
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  typecheck:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Typecheck
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm typecheck
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  publish-e2e:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Publish to Verdaccio, then scaffold, build, and test a consumer app
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm release-e2e
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  gir:
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Extract the project's GTK 4.22 GIR closure
        shell: bash
        run: |
          # Replay the CI image's GTK-from-proposed install in a throwaway
          # ubuntu:26.04 container (GIR is arch-independent XML) on a cheap runner,
          # so the codspeed-macro bench can consume it as an artifact instead of
          # paying an apt/Docker cost on the metered macro minutes.
          mkdir -p gir
          docker run --rm -v "$PWD/gir:/gir" ubuntu:26.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            codename=$(. /etc/os-release; echo "$VERSION_CODENAME")
            printf "deb http://archive.ubuntu.com/ubuntu %s-proposed main\n" "$codename" > /etc/apt/sources.list.d/proposed.list
            printf "Package: *\nPin: release a=%s-proposed\nPin-Priority: 100\n\nPackage: src:gtk4\nPin: release a=%s-proposed\nPin-Priority: 600\n" "$codename" "$codename" > /etc/apt/preferences.d/gtk4-proposed
            apt-get update -qq
            apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev gobject-introspection libgirepository1.0-dev >/dev/null
            cp /usr/share/gir-1.0/*.gir /gir/
          '
          echo "GIR files: $(ls gir | wc -l)"

      - name: Upload the GIR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: gtk-gir
          path: gir/
          retention-days: 1

  bench:
    needs: [changes, gir]
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: codspeed-macro
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      # The macro runner is ARM64; a fresh build is forced so the x86_64 remote
      # cache can never satisfy the native addon or platform-specific outputs.
      TURBO_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Probe runner
        shell: bash
        run: |
          uname -m
          . /etc/os-release && echo "$PRETTY_NAME"

      - name: Install the GTK4 runtime and headless compositor
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev \
            libgirepository1.0-dev gobject-introspection \
            gvfs libgles2 libgl1-mesa-dri \
            weston dbus \
            adwaita-icon-theme gsettings-desktop-schemas shared-mime-info \
            hicolor-icon-theme librsvg2-common \
            fontconfig fonts-noto-core fonts-dejavu-core \
            util-linux libglib2.0-bin
          pkg-config --modversion gtk4

      # The macro runner's apt GTK is too old to type-check the project's newer API
      # surface (loadFromString, newer Adw easings, ...). The `gir` job extracted
      # the exact GIR the project targets on a cheap runner; download it here so the
      # macro job stays fast and Docker-free. A runtime polyfill
      # (tests/bench-setup.ts) bridges the newer surface back to the older runtime.
      - name: Download the matching GTK 4.22 GIR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5.0.0
        with:
          name: gtk-gir
          path: ${{ runner.temp }}/gir

      - name: Point codegen at the downloaded GIR
        shell: bash
        run: echo "GTKX_GIR_PATH=$RUNNER_TEMP/gir" >> "$GITHUB_ENV"

      - name: Cache the headless weston build
        id: weston
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/weston
          key: weston-12.0.4-r2-${{ runner.os }}-${{ runner.arch }}

      - name: Build weston with the headless backend
        if: steps.weston.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # The runner's apt weston (jammy) ships no headless backend, so the vitest
          # per-worker compositor can't start. Build a headless-capable weston from
          # source; 12.x is the newest that builds against the runner's stock
          # libwayland. The benches are non-interactive, so no --fake-seat is needed.
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3-pip pkg-config \
            libwayland-dev libwayland-bin libpixman-1-dev \
            libinput-dev libevdev-dev libxkbcommon-dev libdrm-dev libudev-dev \
            libdbus-1-dev libcairo2-dev libpango1.0-dev libglib2.0-dev \
            libpng-dev libfontconfig1-dev libseat-dev libsystemd-dev libpam0g-dev
          sudo pip3 install --quiet meson
          # jammy's wayland-protocols (1.25) predates weston 12's >= 1.31 floor; the
          # package is data-only (XML + pkg-config), so build the newer release into
          # /usr where weston's meson discovers it. Runtime weston needs none of it.
          WP=1.31
          curl -fsSL "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/${WP}/downloads/wayland-protocols-${WP}.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/wayland-protocols-${WP}/build" "$RUNNER_TEMP/wayland-protocols-${WP}" \
            --prefix=/usr -Dtests=false
          sudo ninja -C "$RUNNER_TEMP/wayland-protocols-${WP}/build" install
          WESTON=12.0.4
          curl -fsSL "https://gitlab.freedesktop.org/wayland/weston/-/releases/${WESTON}/downloads/weston-${WESTON}.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/weston-${WESTON}/build" "$RUNNER_TEMP/weston-${WESTON}" \
            --prefix=/opt/weston --libdir=lib --buildtype=release \
            -Dbackend-default=headless \
            -Dbackend-drm=false -Dbackend-x11=false -Dbackend-rdp=false \
            -Dbackend-vnc=false -Dbackend-wayland=false -Dbackend-pipewire=false \
            -Drenderer-gl=false -Dxwayland=false -Dremoting=false -Dpipewire=false \
            -Dsystemd=false -Dcolor-management-lcms=false \
            -Dimage-jpeg=false -Dimage-webp=false -Dtest-junit-xml=false \
            -Ddemo-clients=false -Dsimple-clients=[] -Dtools=[]
          sudo ninja -C "$RUNNER_TEMP/weston-${WESTON}/build" install

      - name: Put the headless weston on PATH
        shell: bash
        run: |
          echo "/opt/weston/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/weston/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          # GITHUB_ENV only affects later steps, so set the runtime path inline for
          # this in-step sanity check against the freshly installed libweston.
          LD_LIBRARY_PATH="/opt/weston/lib:$LD_LIBRARY_PATH" /opt/weston/bin/weston --version

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Set up Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies and build the benchmark prerequisites
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run the TypeScript benchmarks under CodSpeed
        uses: CodSpeedHQ/action@4e969336ab9acd4f6f8d025fdd793292b0835df0 # v4.18.2
        with:
          mode: walltime
          run: pnpm --filter @gtkx/e2e bench
