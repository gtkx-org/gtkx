name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_WRITE_TOKEN || secrets.NX_READ_TOKEN }}
  GTKX_MAX_WORKERS: "2"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: tests
            script: test
            timeout: 120
          - check: build
            script: build
            timeout: 60
          - check: lint
            script: lint
            timeout: 30
          - check: e2e
            script: e2e
            timeout: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Run check
        env:
          CHECK: ${{ matrix.script }}
        run: pnpm run "$CHECK"

      - name: Typecheck
        if: matrix.check == 'build'
        run: pnpm typecheck
