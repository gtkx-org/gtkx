name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Compute image tags
        id: meta
        run: |
          ref="ghcr.io/gtkx-org/gtkx-ci:df-${{ hashFiles('.github/docker/**') }}"
          tags="$ref"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags=$(printf '%s\n%s' "$ref" "ghcr.io/gtkx-org/gtkx-ci:latest")
          fi
          {
            echo "ref=$ref"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .github/docker
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image

  lint:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Lint
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm lint
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  test:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Run tests
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm test
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  typecheck:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Typecheck
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm typecheck
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  publish-e2e:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Publish to Verdaccio, then scaffold, build, and test a consumer app
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm publish-e2e
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

