name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_WRITE_TOKEN || secrets.NX_READ_TOKEN }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      CAN_PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        if: &can-push env.CAN_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for the image in GHCR
        id: existing
        shell: bash
        env:
          REF: ghcr.io/gtkx-org/gtkx-ci:df-${{ hashFiles('.github/docker/**') }}
        run: |
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "result=present" >> "$GITHUB_OUTPUT"
          else
            echo "result=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: &image-missing steps.existing.outputs.result == 'missing'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push CI image by digest
        id: build
        if: *image-missing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/docker
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/gtkx-org/gtkx-ci,push-by-digest=true,name-canonical=true,push=${{ env.CAN_PUSH }}
          cache-from: type=gha,scope=ci-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-image-${{ matrix.arch }}

      - name: Export the digest
        if: &image-pushed steps.existing.outputs.result == 'missing' && env.CAN_PUSH == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        if: *image-pushed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      CAN_PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image tags
        id: meta
        run: |
          ref="ghcr.io/gtkx-org/gtkx-ci:df-${{ hashFiles('.github/docker/**') }}"
          tags="--tag $ref"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="$tags --tag ghcr.io/gtkx-org/gtkx-ci:latest"
          fi
          {
            echo "ref=$ref"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: *can-push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for the image in GHCR
        id: existing
        shell: bash
        env:
          REF: ${{ steps.meta.outputs.ref }}
        run: |
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "result=present" >> "$GITHUB_OUTPUT"
          else
            echo "result=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the per-arch digests
        if: &manifest-missing steps.existing.outputs.result == 'missing' && env.CAN_PUSH == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-image-digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Merge the digests into a multi-arch manifest list
        if: *manifest-missing
        shell: bash
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REF: ${{ steps.meta.outputs.ref }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $TAGS \
            $(printf 'ghcr.io/gtkx-org/gtkx-ci@sha256:%s ' *)
          docker buildx imagetools inspect "$REF"

      - name: Point the latest tag at the existing image
        if: steps.existing.outputs.result == 'present' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          REF: ${{ steps.meta.outputs.ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag ghcr.io/gtkx-org/gtkx-ci:latest "$REF"

  lint:
    needs: [changes, image-manifest]
    if: &code-changed needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm lint
          image-ref: ${{ needs.image-manifest.outputs.ref }}

      - name: Report failures to Nx Cloud
        if: &fix-ci always() && env.NX_CLOUD_ACCESS_TOKEN != ''
        continue-on-error: true
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm exec nx fix-ci
          install: "false"

  test:
    needs: [changes, image-manifest]
    if: *code-changed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm test
          image-ref: ${{ needs.image-manifest.outputs.ref }}

      - name: Report failures to Nx Cloud
        if: *fix-ci
        continue-on-error: true
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm exec nx fix-ci
          install: "false"

  asan:
    needs: [changes, image-manifest]
    if: *code-changed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the end-to-end suite under AddressSanitizer
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm exec nx run @gtkx/e2e:test:asan
          image-ref: ${{ needs.image-manifest.outputs.ref }}

  typecheck:
    needs: [changes, image-manifest]
    if: *code-changed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Typecheck
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm typecheck
          image-ref: ${{ needs.image-manifest.outputs.ref }}

      - name: Report failures to Nx Cloud
        if: *fix-ci
        continue-on-error: true
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm exec nx fix-ci
          install: "false"

  publish-e2e:
    needs: [changes, image-manifest]
    if: *code-changed
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish to Verdaccio, then scaffold, build, and test a consumer app
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm release-e2e
          image-ref: ${{ needs.image-manifest.outputs.ref }}

      - name: Publish to Verdaccio, then install, build, and run the tutorial app
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm tutorial
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"
