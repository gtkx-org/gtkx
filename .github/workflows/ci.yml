name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'

  # Builds the CI container from this run's Dockerfile and publishes it under a
  # tag derived from the Dockerfile's content hash, so a Dockerfile change is
  # exercised by the same run's jobs instead of leaking the previous `:latest`.
  # Every container job below `needs: image` and pulls exactly this tag.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compute image tags
        id: meta
        run: |
          ref="ghcr.io/gtkx-org/gtkx-ci:df-${{ hashFiles('.github/docker/**') }}"
          tags="$ref"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags=$(printf '%s\n%s' "$ref" "ghcr.io/gtkx-org/gtkx-ci:latest")
          fi
          {
            echo "ref=$ref"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .github/docker
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image

  lint:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Lint
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm lint
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  test:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Run tests
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm test
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  typecheck:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Typecheck
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm typecheck
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  publish-test:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Publish to Verdaccio, then scaffold, build, and test a consumer app
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm publish-test
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  asan:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Build the native addon under AddressSanitizer and run its suite
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm asan
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  miri:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Run Miri over the FFI-free marshalling subset
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm miri
          mount-cargo-cache: "true"

  # The Rust marshalling benches are pure CPU and run in CodSpeed Simulation
  # (instrumented) mode inside the pinned amd64 CI image — deterministic and
  # gate-worthy. run-in-container forwards the OIDC token and GitHub context.
  bench-rust:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
      id-token: write # public repo: authenticate to CodSpeed over OIDC, no token
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Build the Rust benchmark
        uses: ./.github/actions/run-in-container
        with:
          command: cd packages/native && cargo codspeed build --features test-support --bench marshalling
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

      - name: Run the Rust benchmarks under CodSpeed (simulation)
        uses: ./.github/actions/run-in-container
        with:
          install: "false"
          command: pnpm bench:rust
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"
          seccomp-unconfined: "true"

  # The TypeScript/GTK benches measure multi-threaded, I/O-heavy work (the GLib
  # main-loop thread, FFI, a headless compositor), which CodSpeed's instrumented
  # Simulation mode cannot measure deterministically. They run in Walltime mode,
  # which requires a CodSpeed Macro Runner (ARM64 bare metal); Macro Runners must
  # be enabled for the org. The macro runner is bare Ubuntu 22.04 (GTK 4.6, no
  # Docker), so the GTK 4.22.4 stack the benches target is built from source into
  # /opt/gtkx by scripts/build-gtk-stack.sh and published as a GitHub Release
  # asset keyed by the script hash; later runs download it instead of rebuilding.
  # Codegen is restricted to the libraries the benches need (WebKit dropped) so
  # WebKitGTK need not be built.
  bench-ts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: codspeed-macro
    timeout-minutes: 90 # first run builds + publishes the stack; later runs download it
    permissions:
      contents: write # publish/download the prebuilt GTK stack release asset
      packages: read
      id-token: write # public repo: authenticate to CodSpeed over OIDC, no token
    env:
      NODE24_VERSION: "24.17.0"
      NODE22_VERSION: "22.23.0"
      PREFIX: /opt/gtkx
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Provision the GTK stack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Download the prebuilt /opt/gtkx tree from the gtkx-stack-cache release
        # when one matches this script's hash; otherwise build it from source and
        # publish it so later runs skip the ~35-minute build. The build script's
        # apt prerequisites run on both paths, so a downloaded stack still has
        # weston's runtime libraries even though build-dep weston is skipped.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          if ! command -v gh >/dev/null; then
            curl -fsSL https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_arm64.tar.gz \
              | sudo tar -xz -C /usr/local/bin --strip-components=2 gh_2.62.0_linux_arm64/bin/gh
          fi
          hash="$(sha256sum scripts/build-gtk-stack.sh | cut -c1-16)"
          asset="gtkx-stack-${hash}.tar.zst"
          tag="gtkx-stack-cache"
          if gh release download "$tag" --pattern "$asset" --dir /tmp 2>/dev/null; then
            echo "restoring prebuilt $asset"
            sudo tar -C / -I zstd -xf "/tmp/$asset"
          fi
          sudo -E bash scripts/build-gtk-stack.sh
          if [ ! -f "/tmp/$asset" ]; then
            echo "publishing $asset"
            sudo tar -C / -I zstd -cf "/tmp/$asset" opt/gtkx
            gh release view "$tag" >/dev/null 2>&1 \
              || gh release create "$tag" --title "GTK stack cache" \
                   --notes "Prebuilt /opt/gtkx GTK 4.22.4 stacks, keyed by build-gtk-stack.sh hash."
            gh release upload "$tag" "/tmp/$asset" --clobber
          fi

      - name: Export the GTK stack environment
        shell: bash
        run: |
          {
            echo "PATH=/opt/gtkx/bin:$PATH"
            echo "PKG_CONFIG_PATH=/opt/gtkx/lib/aarch64-linux-gnu/pkgconfig:/opt/gtkx/lib/pkgconfig:/opt/gtkx/share/pkgconfig"
            echo "LD_LIBRARY_PATH=/opt/gtkx/lib/aarch64-linux-gnu:/opt/gtkx/lib"
            echo "GI_TYPELIB_PATH=/opt/gtkx/lib/aarch64-linux-gnu/girepository-1.0:/opt/gtkx/lib/girepository-1.0"
            echo "XDG_DATA_DIRS=/opt/gtkx/share:/usr/share:/usr/local/share"
            echo "GTKX_GIR_PATH=/opt/gtkx/share/gir-1.0"
            echo "GDK_PIXBUF_MODULE_FILE=/opt/gtkx/lib/aarch64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache"
            echo "PYTHONPATH=/opt/gtkx/lib/python3/dist-packages"
          } >> "$GITHUB_ENV"

      - name: Install the Rust toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Node and pnpm
        shell: bash
        run: |
          curl -fsSL "https://nodejs.org/dist/v${NODE24_VERSION}/node-v${NODE24_VERSION}-linux-arm64.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local
          sudo mkdir -p /opt/node22
          curl -fsSL "https://nodejs.org/dist/v${NODE22_VERSION}/node-v${NODE22_VERSION}-linux-arm64.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /opt/node22
          node --version | grep -q "v${NODE24_VERSION}"
          /opt/node22/bin/node --version | grep -q "v${NODE22_VERSION}"
          sudo corepack enable

      - name: Install the CodSpeed runner
        shell: bash
        # The installer drops the codspeed binary in ~/.cargo/bin (already on
        # PATH); mirror it into /usr/local/bin so it is also reachable under sudo.
        run: |
          curl -fsSL https://github.com/CodSpeedHQ/codspeed/releases/download/v4.17.6/codspeed-runner-installer.sh | bash
          sudo install -m 0755 "$HOME/.cargo/bin/codspeed" /usr/local/bin/codspeed
          codspeed --version

      - name: Restrict codegen to the bench library set
        shell: bash
        # The benches use only Gtk/Adw/GtkSource; dropping WebKit-6.0 keeps the
        # e2e build green without building WebKitGTK from source.
        run: sed -i 's/, *"WebKit-6.0"//' gtkx.config.ts

      - name: Build the e2e workspace and the native addon
        shell: bash
        # Loose env mode lets codegen and the native build see the exported
        # /opt/gtkx paths (PKG_CONFIG_PATH, GI_TYPELIB_PATH, ...); Turbo's default
        # strict mode would strip them, so codegen could not locate the gir.
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo build --filter=@gtkx/e2e --env-mode=loose

      - name: Run the TypeScript benchmarks under CodSpeed (walltime)
        shell: bash
        run: pnpm bench:ts
