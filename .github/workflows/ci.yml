name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: ghcr.io/gtkx-org/gtkx-ci:ubuntu26-v6
  NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_WRITE_TOKEN || secrets.NX_READ_TOKEN }}
  NX_CLOUD_DISABLE_METRICS_COLLECTION: "true"
  NODE_OPTIONS: --max-old-space-size=8192

defaults:
  run:
    shell: bash

jobs:
  image:
    name: Prepare CI image
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: gtkx-ci-image
      cancel-in-progress: false
      queue: max
    outputs:
      image: ${{ steps.ready.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select CI environment
        id: environment
        env:
          TRUSTED_CHECKOUT: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$TRUSTED_CHECKOUT" == true ]]; then
            echo "image=$CI_IMAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.environment.outputs.image != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        if: steps.environment.outputs.image != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Look up immutable image
        id: existing
        if: steps.environment.outputs.image != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --paginate /orgs/gtkx-org/packages/container/gtkx-ci/versions --jq '.[].metadata.container.tags[]' > "$RUNNER_TEMP/image-tags" 2> "$RUNNER_TEMP/image-error"; then
            if grep -Fxq "${CI_IMAGE##*:}" "$RUNNER_TEMP/image-tags"; then
              echo 'exists=true' >> "$GITHUB_OUTPUT"
            else
              echo 'exists=false' >> "$GITHUB_OUTPUT"
            fi
          elif grep -Fq '(HTTP 404)' "$RUNNER_TEMP/image-error"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/image-error" >&2
            exit 1
          fi

      - name: Publish missing CI image
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: .github/ci/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.environment.outputs.image }}
          cache-from: type=gha,scope=gtkx-ci
          cache-to: type=gha,mode=max,scope=gtkx-ci

      - name: Resolve public image digest
        id: ready
        if: steps.environment.outputs.image != ''
        run: |
          docker logout ghcr.io
          if ! manifest="$(docker buildx imagetools inspect "$CI_IMAGE" --format '{{json .Manifest}}')"; then
            echo '::error::Make the gtkx-ci GHCR package public so CI jobs can pull it, then rerun CI.'
            exit 1
          fi
          digest="$(jq -er '.digest' <<< "$manifest")"
          echo "image=${CI_IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"

  checks:
    name: ${{ matrix.name }}
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and typecheck
            args: -t build,typecheck
          - name: Lint
            args: -t lint
          - name: Test
            args: -t test --exclude=@gtkx/cli,@gtkx/codegen
          - name: Test CLI
            args: -t test --exclude=*,!@gtkx/cli
          - name: Test codegen
            args: -t test --exclude=*,!@gtkx/codegen
          - name: End-to-end
            args: -t test-asan,e2e
            user: root
    env:
      SWC_NATIVE_BINDING_CACHE: /tmp/swc-native-cache
    container:
      image: ${{ needs.image.outputs.image }}
      options: --user ${{ matrix.user || 'workflows' }} --privileged --shm-size=2g
    steps:
      - name: Report image preparation failure
        if: needs.image.result != 'success'
        run: |
          echo '::error::CI image preparation failed. See the Prepare CI image job.'
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust container workspace
        if: needs.image.outputs.image != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Determine affected commit range
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c

      - name: Set up fallback workspace
        id: fallback
        if: needs.image.outputs.image == ''
        uses: ./.github/actions/setup-ci

      - name: Set up fallback Go
        if: needs.image.outputs.image == ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.6"
          cache: false

      - name: Cache pnpm downloads
        if: needs.image.outputs.image != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install workspace dependencies
        id: install
        if: needs.image.outputs.image != ''
        run: pnpm install --frozen-lockfile --store-dir .pnpm-store

      - name: Check release plans
        if: >-
          matrix.name == 'Lint' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.type != 'Bot' &&
          !(github.event.pull_request.head.ref == 'release/next' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          plan_backup="$(mktemp -d)"
          restore_plans() {
            for plan in "$plan_backup"/*.md; do
              [[ -e "$plan" ]] || continue
              mv -- "$plan" .nx/version-plans/
            done
            rmdir -- "$plan_backup"
          }
          trap restore_plans EXIT
          while IFS= read -r -d '' plan; do
            if git diff --quiet "$NX_BASE" "$NX_HEAD" -- "$plan"; then
              mv -- "$plan" "$plan_backup/"
            fi
          done < <(git ls-files -z -- '.nx/version-plans/*.md')
          pnpm exec nx release plan:check --base="$NX_BASE" --head="$NX_HEAD"

      - name: Run workspace checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          NX_ARGS: ${{ matrix.args }}
        run: |
          read -ra args <<< "$NX_ARGS"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            pnpm exec nx run-many "${args[@]}"
          else
            pnpm exec nx affected "${args[@]}"
          fi

      - name: Check current Rust advisories
        if: ${{ matrix.name == 'Lint' && !cancelled() && (steps.install.outcome == 'success' || steps.fallback.outcome == 'success') }}
        run: |
          if ! command -v cargo-audit > /dev/null; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          cargo audit --file packages/native/Cargo.lock --deny unsound

  verify:
    name: Verify workspace
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "$RESULT" != success ]]; then
            echo "::error::Workspace checks finished with result: $RESULT"
            exit 1
          fi
