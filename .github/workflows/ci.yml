name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compute image tags
        id: meta
        run: |
          ref="ghcr.io/gtkx-org/gtkx-ci:df-${{ hashFiles('.github/docker/**') }}"
          tags="$ref"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags=$(printf '%s\n%s' "$ref" "ghcr.io/gtkx-org/gtkx-ci:latest")
          fi
          {
            echo "ref=$ref"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/docker
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image

  lint:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Lint
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm lint
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  test:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Run tests
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm test
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  typecheck:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Typecheck
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm typecheck
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  publish-e2e:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Publish to Verdaccio, then scaffold, build, and test a consumer app
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm release-e2e
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

  bench:
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: codspeed-macro
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      # The macro runner is ARM64; a fresh build is forced so the x86_64 remote
      # cache can never satisfy the native addon or platform-specific outputs.
      TURBO_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Probe runner
        shell: bash
        run: |
          uname -m
          . /etc/os-release && echo "$PRETTY_NAME"

      - name: Install the GTK4 runtime and headless compositor
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev \
            libgirepository1.0-dev gobject-introspection \
            gvfs libgles2 libgl1-mesa-dri \
            weston dbus \
            adwaita-icon-theme gsettings-desktop-schemas shared-mime-info \
            hicolor-icon-theme librsvg2-common \
            fontconfig fonts-noto-core fonts-dejavu-core \
            util-linux libglib2.0-bin
          pkg-config --modversion gtk4

      - name: Fetch a newer GTK GIR set for codegen
        shell: bash
        run: |
          # The macro runner's apt GTK predates loadFromString (GTK 4.12+), so the
          # bindings the build type-checks against are generated from a newer GIR
          # closure. Fedora ships a >=4.12 GTK stack; its GIR is arch-independent
          # XML. A runtime polyfill (tests/bench-setup.ts) bridges the newer API
          # surface back to the older runtime the benches actually execute on.
          mkdir -p "$RUNNER_TEMP/gir"
          docker run --rm -v "$RUNNER_TEMP/gir:/gir" fedora:41 bash -c '
            dnf install -y --setopt=install_weak_deps=False gtk4-devel libadwaita-devel gtksourceview5-devel >/dev/null
            cp /usr/share/gir-1.0/*.gir /gir/
          '
          echo "GIR files: $(ls "$RUNNER_TEMP/gir" | wc -l); load_from_string present: $(grep -c load_from_string "$RUNNER_TEMP/gir/Gtk-4.0.gir")"
          echo "GTKX_GIR_PATH=$RUNNER_TEMP/gir" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Set up Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies and build the benchmark prerequisites
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run the TypeScript benchmarks under CodSpeed
        uses: CodSpeedHQ/action@4e969336ab9acd4f6f8d025fdd793292b0835df0 # v4.18.2
        with:
          mode: walltime
          run: pnpm --filter @gtkx/e2e bench
