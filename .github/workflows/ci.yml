name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_WRITE_TOKEN || secrets.NX_READ_TOKEN }}
  GTKX_MAX_WORKERS: "2"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: tests
            script: test
            timeout: 120
          - check: build
            script: build
            timeout: 60
          - check: lint
            script: lint
            timeout: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install Rust advisory audit
        if: matrix.check == 'lint'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/cargo-audit"
          echo "$RUNNER_TEMP/cargo-audit/bin" >> "$GITHUB_PATH"

      - name: Run check
        env:
          CHECK: ${{ matrix.script }}
        run: pnpm run "$CHECK"

      - name: Typecheck
        if: matrix.check == 'build'
        run: pnpm typecheck

  e2e-shards:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Run E2E shard
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm e2e -- --shard="$SHARD/4"

  e2e:
    if: always()
    needs: e2e-shards
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every E2E shard
        env:
          RESULT: ${{ needs.e2e-shards.result }}
        run: test "$RESULT" = success
