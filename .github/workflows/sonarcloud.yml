name: SonarCloud

on:
  workflow_call:
    inputs:
      coverage:
        required: true
        type: boolean

permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_WRITE_TOKEN || secrets.NX_READ_TOKEN }}

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PNPM_CONFIG_NODE_LINKER: hoisted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage
        if: inputs.coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sonar-coverage-*
          merge-multiple: true
          path: coverage-artifacts

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2

      - name: Enable pnpm
        shell: bash
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install

      - name: Restore pnpm store
        uses: ./.github/actions/setup-pnpm-cache

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Merge coverage
        if: inputs.coverage
        shell: bash
        run: pnpm exec nx run gtkx:coverage-merge

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: ${{ !inputs.coverage && '-Dsonar.coverage.exclusions=**/*' || '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
