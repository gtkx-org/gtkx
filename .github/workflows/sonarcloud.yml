name: SonarCloud

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Pin this run's content-addressed CI image (same tag the ci.yml `image`
      # job builds) so coverage runs against the current Dockerfile. Without it,
      # pull-image falls back to the stale :latest, which lacks tools this run's
      # code expects (e.g. wlheadless-run). When the tag is not yet pushed,
      # pull-image rebuilds the current Dockerfile locally. hashFiles must run
      # after checkout, so this is a step rather than a job-level env.
      - name: Compute CI image ref
        run: echo "CI_IMAGE_REF=ghcr.io/gtkx-org/gtkx-ci:df-${{ hashFiles('.github/docker/**') }}" >> "$GITHUB_ENV"

      - name: Setup CI
        uses: ./.github/actions/setup-ci

      - name: Generate coverage
        uses: ./.github/actions/run-in-container
        with:
          command: pnpm coverage
          mount-cargo-cache: "true"
          mount-pnpm-store: "true"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
