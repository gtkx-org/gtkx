name: SonarCloud

on:
  workflow_call:
    inputs:
      coverage:
        required: true
        type: boolean
      image-ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_WRITE_TOKEN || secrets.NX_READ_TOKEN }}

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PNPM_CONFIG_NODE_LINKER: hoisted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage
        if: inputs.coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sonar-coverage-*
          merge-multiple: true
          path: coverage-artifacts

      - name: Set up Node.js
        if: ${{ !inputs.coverage }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2

      - name: Enable pnpm
        if: ${{ !inputs.coverage }}
        shell: bash
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install

      - name: Restore pnpm store
        if: ${{ !inputs.coverage }}
        uses: ./.github/actions/setup-pnpm-cache

      - name: Install dependencies
        if: ${{ !inputs.coverage }}
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Validate coverage image
        if: inputs.coverage
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: '[[ "$IMAGE_REF" == "artifact:ci-image" || "$IMAGE_REF" =~ ^ghcr\.io/gtkx-org/gtkx-ci@sha256:[a-f0-9]{64}$ ]]'

      - name: Merge coverage
        if: inputs.coverage
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm exec nx run gtkx:coverage-merge
          image-ref: ${{ inputs.image-ref }}
          extra-env: PNPM_CONFIG_NODE_LINKER

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: ${{ !inputs.coverage && '-Dsonar.coverage.exclusions=**/*' || '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
