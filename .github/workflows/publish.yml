name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_READ_TOKEN }}

jobs:
  validate-release:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Run this workflow from the release tag"
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('packages/create-gtkx/package.json', 'utf8')).version")"
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}"
            exit 1
          fi
          release="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft,tagName)"
          if [ "$(jq -r '.isDraft' <<<"${release}")" != "true" ]; then
            echo "::error::Release ${GITHUB_REF_NAME} is not a draft"
            exit 1
          fi
          if [ "$(jq -r '.tagName' <<<"${release}")" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Draft release does not match ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Verify exact release commit
        id: verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-release.sh

  build-native:
    needs: validate-release
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ci

      - name: Build native binary
        run: pnpm exec nx run @gtkx/native:build --skip-nx-cache

      - name: Stage native bindings and checksums
        working-directory: packages/native
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p artifacts
          cp "native.linux-${RELEASE_ARCH}-gnu.node" artifacts/
          cp index.js "artifacts/index.linux-${RELEASE_ARCH}-gnu.js"
          cp index.d.ts "artifacts/index.linux-${RELEASE_ARCH}-gnu.d.ts"
          cd artifacts
          for artifact in "native.linux-${RELEASE_ARCH}-gnu.node" "index.linux-${RELEASE_ARCH}-gnu.js" "index.linux-${RELEASE_ARCH}-gnu.d.ts"; do
            sha256sum "$artifact" > "$artifact.sha256"
          done

      - name: Accept native artifact through published consumers
        env:
          GTKX_RELEASE_NATIVE_ARTIFACTS: "true"
        run: pnpm exec nx run @gtkx/e2e:e2e --skip-nx-cache -- tests/publish.test.ts

      - name: Upload native bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-linux-${{ matrix.arch }}-gnu
          path: packages/native/artifacts/*
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  publish:
    needs: build-native
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    environment: npm-release
    env:
      NPM_CONFIG_PROVENANCE: "true"
      GTKX_RELEASE_NATIVE_ARTIFACTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download native bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-linux-*-gnu
          merge-multiple: true
          path: packages/native/artifacts

      - name: Restore verified native bindings before dependency installation
        shell: bash
        run: bash .github/scripts/restore-native-artifacts.sh

      - uses: ./.github/actions/setup-ci

      - name: Release
        run: pnpm release

  publish-release:
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve final release state
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft,tagName)"
          if [ "$(jq -r '.tagName' <<<"${release}")" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Draft release does not match ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "is-draft=$(jq -r '.isDraft' <<<"${release}")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .github/node-version
          package-manager-cache: false

      - name: Verify complete release channel before publication
        run: node --experimental-strip-types scripts/verify-release-channel.ts

      - name: Publish GitHub release
        if: steps.release.outputs.is-draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Build the website for the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
