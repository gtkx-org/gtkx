name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_WRITE_TOKEN || secrets.NX_READ_TOKEN }}

jobs:
  build-native:
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build native binary
        uses: ./.github/actions/run-ci-command
        with:
          command: pnpm exec nx run @gtkx/native:build --skip-nx-cache
          image-ref: ghcr.io/gtkx-org/gtkx-ci:df-${{ hashFiles('.github/docker/**') }}

      - name: Upload native binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-${{ matrix.arch }}-gnu
          path: packages/native/native.linux-${{ matrix.arch }}-gnu.node
          if-no-files-found: error

  publish:
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download x64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-linux-x64-gnu
          path: packages/native/artifacts

      - name: Download arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-linux-arm64-gnu
          path: packages/native/artifacts

      - name: Stage OIDC token request for the release container
        shell: bash
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token request variables are unavailable; the publish job needs id-token: write"
            exit 1
          fi
          echo "::add-mask::${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          umask 077
          {
            printf 'export ACTIONS_ID_TOKEN_REQUEST_URL=%q\n' "${ACTIONS_ID_TOKEN_REQUEST_URL}"
            printf 'export ACTIONS_ID_TOKEN_REQUEST_TOKEN=%q\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          } > "${GITHUB_WORKSPACE}/.oidc.env"

      - name: Release
        uses: ./.github/actions/run-ci-command
        with:
          command: >-
            . /workspace/.oidc.env;
            rm -f /workspace/.oidc.env;
            echo "oidc-token-len=${#ACTIONS_ID_TOKEN_REQUEST_TOKEN}";
            pnpm release
          extra-env: >-
            NPM_CONFIG_PROVENANCE
            GITHUB_ACTIONS
            GITHUB_SERVER_URL
            GITHUB_REPOSITORY
            GITHUB_REPOSITORY_ID
            GITHUB_REPOSITORY_OWNER
            GITHUB_REPOSITORY_OWNER_ID
            GITHUB_REF
            GITHUB_SHA
            GITHUB_RUN_ID
            GITHUB_RUN_NUMBER
            GITHUB_RUN_ATTEMPT
            GITHUB_WORKFLOW
            GITHUB_WORKFLOW_REF
            GITHUB_EVENT_NAME
            GITHUB_ACTOR
            GITHUB_ACTOR_ID
            GITHUB_JOB
            RUNNER_ENVIRONMENT
          image-ref: ghcr.io/gtkx-org/gtkx-ci:df-${{ hashFiles('.github/docker/**') }}
