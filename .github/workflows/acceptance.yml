name: Published consumers

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_WRITE_TOKEN || secrets.NX_READ_TOKEN }}
  GTKX_MAX_WORKERS: "2"
  NODE_OPTIONS: --max-old-space-size=8192
  NX_CI_EXECUTION_ENV: acceptance

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - run: pnpm exec nx run @gtkx/e2e:acceptance --no-agents
