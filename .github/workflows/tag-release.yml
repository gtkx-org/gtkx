name: Tag release

on:
  push:
    branches:
      - main
    paths:
      - packages/create-gtkx/package.json

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Resolve the release state
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/create-gtkx/package.json').version")"
          lookup="${RUNNER_TEMP}/release-lookup"
          if release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${version}" 2> "$lookup")"; then
            if [ "$(jq -r '.draft' <<<"${release}")" = "true" ]; then
              state=draft
            else
              state=published
            fi
          elif ! grep -q 'HTTP 404' "$lookup"; then
            cat "$lookup" >&2
            echo "::error::Could not read the release state for v${version}"
            exit 1
          elif [ -f CHANGELOG.md ] && awk -v version="$version" '
            /^##? / { if ($2 == version) { found = 1; exit } }
            END { exit found ? 0 : 1 }
          ' CHANGELOG.md; then
            state=missing
          else
            state=unprepared
          fi
          {
            echo "version=$version"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"

      - name: Extract the release notes
        if: steps.release.outputs.state == 'missing'
        id: notes
        uses: ./.github/actions/release-notes
        with:
          version: ${{ steps.release.outputs.version }}

      - name: Tag, draft the release and dispatch Publish
        if: steps.release.outputs.state == 'missing' || steps.release.outputs.state == 'draft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          STATE: ${{ steps.release.outputs.state }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          peeled="$(git ls-remote origin "refs/tags/${tag}^{}" | cut -f1)"
          target="${peeled:-$(git ls-remote origin "refs/tags/${tag}" | cut -f1)}"
          if [ -n "$target" ] && [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::Tag ${tag} already points at ${target} instead of ${GITHUB_SHA}"
            exit 1
          fi
          if [ -z "$target" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "${tag}" --message "${tag}" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          fi
          if [ "$STATE" = "missing" ]; then
            prerelease=()
            case "$VERSION" in
              *-*) prerelease=(--prerelease) ;;
            esac
            gh release create "${tag}" --draft "${prerelease[@]}" --verify-tag \
              --title "${tag}" --notes-file "$NOTES"
          fi
          gh workflow run publish.yml --ref "${tag}"
