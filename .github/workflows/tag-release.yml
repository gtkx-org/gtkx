name: Tag release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false
  queue: max

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      checks: read
      pull-requests: read
      security-events: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve the release state
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          candidates="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" --paginate --slurp)"
          if ! jq -e --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            [.[][] | select(.merged_at != null and .merge_commit_sha == $sha and
              .base.ref == "main" and .head.ref == "release/next" and .head.repo.full_name == $repo)]
            | length == 1
          ' <<<"$candidates" > /dev/null; then
            echo "state=unprepared" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node -p "require('./packages/create-gtkx/package.json').version")"
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --slurp)"
          release="$(jq -c --arg tag "v${version}" '[.[][] | select(.tag_name == $tag)] | first' <<<"$releases")"
          if [ "$release" != "null" ]; then
            if [ "$(jq -r '.draft' <<<"${release}")" = "true" ]; then
              state=draft
            else
              state=published
            fi
          elif [ -f CHANGELOG.md ] && awk -v version="$version" '
            /^##? / { if ($2 == version) { found = 1; exit } }
            END { exit found ? 0 : 1 }
          ' CHANGELOG.md; then
            state=missing
          else
            state=unprepared
          fi
          {
            echo "version=$version"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release commit and review
        if: steps.release.outputs.state == 'missing' || steps.release.outputs.state == 'draft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/verify-release.sh

      - name: Extract the release notes
        if: steps.release.outputs.state == 'missing'
        id: notes
        uses: ./.github/actions/release-notes
        with:
          version: ${{ steps.release.outputs.version }}

      - name: Tag, draft the release and dispatch Publish
        if: steps.release.outputs.state == 'missing' || steps.release.outputs.state == 'draft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          STATE: ${{ steps.release.outputs.state }}
          NOTES: ${{ steps.notes.outputs.path }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          peeled="$(git ls-remote origin "refs/tags/${tag}^{}" | cut -f1)"
          target="${peeled:-$(git ls-remote origin "refs/tags/${tag}" | cut -f1)}"
          if [ -n "$target" ] && [ "$target" != "$RELEASE_SHA" ]; then
            echo "::error::Tag ${tag} already points at ${target} instead of ${RELEASE_SHA}"
            exit 1
          fi
          if [ -z "$target" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "${tag}" --message "${tag}" "$RELEASE_SHA"
            git push origin "refs/tags/${tag}"
          fi
          if [ "$STATE" = "missing" ]; then
            prerelease=()
            case "$VERSION" in
              *-*) prerelease=(--prerelease) ;;
            esac
            gh release create "${tag}" --draft "${prerelease[@]}" --verify-tag \
              --title "${tag}" --notes-file "$NOTES"
          fi
          gh workflow run publish.yml --ref "${tag}"
