name: Runtime Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: runtime-compatibility
  cancel-in-progress: false

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_READ_TOKEN }}

jobs:
  verified-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.run.outputs.sha }}
      image-ref: ${{ steps.image.outputs.image-ref }}
    steps:
      - name: Find verified main revision
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1")"
          sha="$(jq -er '.workflow_runs[0].head_sha' <<<"$baseline")"
          run_id="$(jq -er '.workflow_runs[0].id' <<<"$baseline")"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$run_id" =~ ^[0-9]+$ ]]
          printf 'sha=%s\nrun-id=%s\n' "$sha" "$run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified image reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-ci-image
          run-id: ${{ steps.run.outputs.run-id }}
          github-token: ${{ github.token }}
          path: release-verification

      - name: Read immutable image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$(cat release-verification/ci-image-ref.txt)"
          [[ "$image_ref" =~ ^ghcr\.io/gtkx-org/gtkx-ci@sha256:[a-f0-9]{64}$ ]]
          printf 'image-ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

  minimum-node-consumer:
    needs: verified-main
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout verified main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verified-main.outputs.sha }}
          persist-credentials: false

      - name: Verify consumers on minimum Node
        uses: ./.github/actions/run-ci-command
        with:
          command: bash scripts/check-minimum-node.sh
          image-ref: ${{ needs.verified-main.outputs.image-ref }}

  query-performance:
    needs: verified-main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout verified main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verified-main.outputs.sha }}
          persist-credentials: false

      - name: Measure query performance
        uses: ./.github/actions/run-ci-command
        with:
          command: >-
            pnpm exec nx run gtkx:coverage-dependencies &&
            pnpm exec nx run @gtkx/e2e:codegen &&
            pnpm exec nx run @gtkx/e2e:test-fixtures &&
            pnpm --filter @gtkx/e2e exec vitest run tests/testing/query-perf.test.tsx
            --maxWorkers=1 --reporter=default --reporter=json
            --outputFile.json=/workspace/benchmark-results/query-performance.json
          image-ref: ${{ needs.verified-main.outputs.image-ref }}

      - name: Upload performance result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: query-performance
          path: benchmark-results/query-performance.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
