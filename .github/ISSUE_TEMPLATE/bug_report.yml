name: Bug report
description: Report a bug or unexpected behavior in GTKX
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a minimal repository, or the smallest app code and the steps that show the bug. Start from `npm create gtkx@beta` when you can, and say whether it happens in `npm run dev`, `npm test`, or a packaged build.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Run these commands in your app's directory and paste the output, followed by your Linux distribution and version.
      placeholder: |
        npx gtkx --version
        node -v
        pkg-config --modversion gtk4 libadwaita-1 glib-2.0
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Error messages and terminal output, pasted as text rather than screenshots.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots of the UI or anything else that helps explain the bug.
