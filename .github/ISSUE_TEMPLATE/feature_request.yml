name: Feature request
description: Suggest a new feature or an improvement to GTKX
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard with GTKX today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen. Code showing the API you have in mind helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links to the GTK or Adwaita API involved, or examples from other projects.
