name: Run CI Command
description: Set up the CI image, Nx env, and caches via `setup-ci`, then run a command in the CI container with the cargo and pnpm caches mounted.

inputs:
  command:
    description: Command to run inside the container
    required: true
  image-ref:
    description: CI image reference for `pull-image`; when empty, gtkx-ci:latest is used
    default: ""
  extra-env:
    description: Extra environment variables to forward as `-e NAME` flags (whitespace-separated, names only)
    default: ""

runs:
  using: composite
  steps:
    - name: Setup CI
      uses: ./.github/actions/setup-ci
      env:
        CI_IMAGE_REF: ${{ inputs.image-ref }}

    - name: Run command
      uses: ./.github/actions/run-in-container
      with:
        command: ${{ inputs.command }}
        mount-cargo-cache: "true"
        mount-pnpm-store: "true"
        extra-env: ${{ inputs.extra-env }}
