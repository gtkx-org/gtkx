name: Setup CI
description: Install workspace dependencies and native tooling on Ubuntu 26.04.

inputs:
  rust-cache-key:
    description: Rust build profile to cache separately.
    default: build

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: package.json
        package-manager-cache: false

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        cache: true

    - name: Install native dependencies
      shell: bash
      run: |
        if [ "$(dpkg --print-architecture)" = amd64 ]; then
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$source" ]; then
              sudo sed -i -E \
                -e 's#mirror\+file:/etc/apt/apt-mirrors\.txt([[:space:]]|$)#https://archive.ubuntu.com/ubuntu/\1#g' \
                -e 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?([[:space:]]|$)#https://archive.ubuntu.com/ubuntu/\1#g' \
                "$source"
            fi
          done
        fi
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential meson ninja-build gettext locales-all pkg-config shellcheck \
          libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev \
          libgstreamer1.0-dev libgirepository1.0-dev libostree-dev gobject-introspection \
          gvfs libgles2 libgl1-mesa-dri mesa-vulkan-drivers sway weston xwayland-run dbus \
          libasan8 adwaita-icon-theme gsettings-desktop-schemas shared-mime-info \
          hicolor-icon-theme librsvg2-common desktop-file-utils espeak-ng \
          flatpak-builder appstream dpkg-dev rpm pipx fontconfig fonts-noto-core fonts-dejavu-core
        gst_gir="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/gir-1.0/Gst-1.0.gir"
        if [ -f "$gst_gir" ]; then
          sudo ln -sf "$gst_gir" /usr/share/gir-1.0/Gst-1.0.gir
        fi
        pipx install 'git+https://github.com/flatpak/flatpak-builder-tools.git@de2225a6dee4818c1339b3cdbf29f90c471fcb7e#subdirectory=node'
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Select repository Rust toolchains
      shell: bash
      run: |
        rustup show
        (cd packages/native/tools && rustup show)

    - name: Fingerprint native build environment
      id: native-environment
      shell: bash
      run: echo "hash=$(node scripts/cache-environment.ts native)" >> "$GITHUB_OUTPUT"

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: ${{ inputs.rust-cache-key }}-${{ steps.native-environment.outputs.hash }}
        workspaces: |
          packages/native -> target
        cache-bin: false
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Configure test environment
      shell: bash
      run: |
        {
          echo 'GIT_CONFIG_COUNT=1'
          echo 'GIT_CONFIG_KEY_0=init.defaultBranch'
          echo 'GIT_CONFIG_VALUE_0=main'
          echo 'CARGO_INCREMENTAL=0'
          for driver in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if [ -f "$driver" ]; then
              echo "VK_DRIVER_FILES=$driver"
            fi
          done
        } >> "$GITHUB_ENV"

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
