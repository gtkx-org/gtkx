name: Setup CI
description: Pull the CI image, compute the version env vars Nx hashes, and restore the cargo and pnpm caches. Composes the smaller setup composites so individual jobs don't repeat the boilerplate.

runs:
  using: composite
  steps:
    - name: Pull CI image
      uses: ./.github/actions/pull-image

    - name: Compute cache env
      uses: ./.github/actions/compute-cache-env

    - name: Setup cargo cache
      uses: ./.github/actions/setup-cargo-cache

    - name: Setup pnpm cache
      uses: ./.github/actions/setup-pnpm-cache
