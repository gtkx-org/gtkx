name: Compute Cache Env
description: Export the immutable CI image ID for Nx cache keys.

runs:
  using: composite
  steps:
    - name: Read CI image ID
      shell: bash
      run: |
        image_id="$(podman image inspect --format '{{.Id}}' localhost/gtkx-ci:local)"
        test -n "$image_id"
        echo "CI_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
