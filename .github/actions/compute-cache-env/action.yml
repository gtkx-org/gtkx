name: Compute Cache Env
description: Inspect the CI container and image; export their identities to $GITHUB_ENV so they participate in Nx cache keys.

runs:
  using: composite
  steps:
    - name: Read versions from container
      shell: bash
      run: |
        read_versions() {
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace gtkx-ci:local bash -c '
            printf "NODE_VERSION=%s\n" "$(node -v)"
            printf "GTK4_VERSION=%s\n" "$(pkg-config --modversion gtk4)"
          '
          image_id=$(docker image inspect --format '{{.Id}}' gtkx-ci:local)
          printf "CI_IMAGE_ID=%s\n" "$image_id"
        }
        read_versions >> "$GITHUB_ENV"
