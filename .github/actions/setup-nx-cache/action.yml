name: Setup Nx Cache
description: Cache the local Nx task cache so unchanged tasks are restored instead of re-run.

runs:
  using: composite
  steps:
    - name: Restore Nx cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-${{ runner.arch }}-
