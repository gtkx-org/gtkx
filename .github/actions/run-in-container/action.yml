name: Run in Container
description: Run a command in the prebuilt CI Docker container (gtkx-ci:local). Caching, env-var computation, and image pulls are the responsibility of separate composite actions.

inputs:
  command:
    description: Command to run inside the container
    required: true
  install:
    description: Run `pnpm install --frozen-lockfile` before the command
    default: "true"
  mount-cargo-cache:
    description: Mount $HOME/.cargo/{registry,git} into the container so `setup-cargo-cache` data is reused
    default: "false"
  mount-pnpm-store:
    description: Mount $HOME/.local/share/pnpm/store into the container so `setup-pnpm-cache` data is reused
    default: "false"
  extra-env:
    description: Extra environment variables to forward as `-e NAME` flags (whitespace-separated, names only)
    default: ""

runs:
  using: composite
  steps:
    - name: Run command
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_INSTALL: ${{ inputs.install }}
        INPUT_MOUNT_CARGO_CACHE: ${{ inputs.mount-cargo-cache }}
        INPUT_MOUNT_PNPM_STORE: ${{ inputs.mount-pnpm-store }}
        INPUT_EXTRA_ENV: ${{ inputs.extra-env }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail

        CONTAINER_HOME="$RUNNER_TEMP/container-home"
        mkdir -p "$CONTAINER_HOME"

        DOCKER_ARGS=(--rm --user "$(id -u):$(id -g)" -e HOME=/ci-home)
        DOCKER_ARGS+=(-v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro)
        DOCKER_ARGS+=(-v "$CONTAINER_HOME:/ci-home" -v "$WORKSPACE:/workspace" -w /workspace)

        if [ "$INPUT_MOUNT_CARGO_CACHE" = "true" ]; then
          DOCKER_ARGS+=(-v "$HOME/.cargo/registry:/usr/local/cargo/registry")
          DOCKER_ARGS+=(-v "$HOME/.cargo/git:/usr/local/cargo/git")
        fi

        if [ "$INPUT_MOUNT_PNPM_STORE" = "true" ]; then
          DOCKER_ARGS+=(-v "$HOME/.local/share/pnpm/store:/ci-home/.local/share/pnpm/store")
        fi

        for var in NODE_VERSION GTK4_VERSION VERSION NX_CLOUD_ACCESS_TOKEN \
          CI GITHUB_ACTIONS GITHUB_EVENT_NAME GITHUB_REF GITHUB_REF_NAME \
          GITHUB_HEAD_REF GITHUB_BASE_REF GITHUB_SHA GITHUB_REPOSITORY \
          GITHUB_RUN_ID GITHUB_RUN_NUMBER GITHUB_RUN_ATTEMPT GITHUB_WORKFLOW \
          GITHUB_JOB GITHUB_SERVER_URL; do
          if [ -n "${!var:-}" ]; then
            DOCKER_ARGS+=(-e "$var")
          fi
        done

        if [ -n "$INPUT_EXTRA_ENV" ]; then
          for name in $INPUT_EXTRA_ENV; do
            DOCKER_ARGS+=(-e "$name")
          done
        fi

        TRUST_WORKSPACE="git config --global --add safe.directory /workspace"

        if [ "$INPUT_INSTALL" = "true" ]; then
          FULL_COMMAND="$TRUST_WORKSPACE && pnpm install --frozen-lockfile && $INPUT_COMMAND"
        else
          FULL_COMMAND="$TRUST_WORKSPACE && $INPUT_COMMAND"
        fi

        docker run "${DOCKER_ARGS[@]}" gtkx-ci:local bash -c "$FULL_COMMAND"
