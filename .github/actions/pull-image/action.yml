name: Pull CI Image
description: Pull this run's CI image (CI_IMAGE_REF, built by the `image` job) and retag locally as localhost/gtkx-ci:local. When CI_IMAGE_REF is set but unpullable (e.g. a fork PR whose image job can't push to GHCR), build the current Dockerfile locally so its changes are still exercised; :latest is used only when no ref is given.

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Pull image
      id: pull
      shell: bash
      run: |
        set -euo pipefail

        if [ -n "${CI_IMAGE_REF:-}" ]; then
          ref="$CI_IMAGE_REF"
        else
          ref="ghcr.io/gtkx-org/gtkx-ci:latest"
        fi
        auth_file="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
        if podman pull --authfile "$auth_file" "$ref"; then
          podman tag "$ref" localhost/gtkx-ci:local
          echo "result=pulled" >> "$GITHUB_OUTPUT"
        else
          echo "result=missing" >> "$GITHUB_OUTPUT"
        fi

    - name: Build image locally (fallback)
      if: steps.pull.outputs.result == 'missing'
      shell: bash
      env:
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        case "$RUNNER_ARCH" in
          X64) target_arch=amd64 ;;
          ARM64) target_arch=arm64 ;;
          *) exit 1 ;;
        esac

        podman build \
          --build-arg "TARGETARCH=$target_arch" \
          --tag localhost/gtkx-ci:local \
          .github/docker
