name: Pull CI Image
description: Pull this run's CI image (CI_IMAGE_REF, built by the `image` job) and retag locally as gtkx-ci:local; fall back to :latest, then a cache-primed local build if the registry image is unavailable.

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

    - name: Pull image
      id: pull
      shell: bash
      run: |
        for ref in "${CI_IMAGE_REF:-}" "ghcr.io/gtkx-org/gtkx-ci:latest"; do
          [ -z "$ref" ] && continue
          if docker pull "$ref"; then
            docker tag "$ref" gtkx-ci:local
            echo "result=pulled" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "result=missing" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx (fallback build)
      if: steps.pull.outputs.result == 'missing'
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Build image locally (fallback)
      if: steps.pull.outputs.result == 'missing'
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .github/docker
        load: true
        tags: gtkx-ci:local
        cache-from: type=gha,scope=ci-image
