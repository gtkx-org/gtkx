name: Pull CI Image
description: Load this run's immutable registry image or its architecture-specific fork artifact.

runs:
  using: composite
  steps:
    - name: Select image source
      id: source
      shell: bash
      env:
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        if [ "${CI_IMAGE_REF:-}" = "artifact:ci-image" ]; then
          case "$RUNNER_ARCH" in
            X64) echo "artifact=ci-image-amd64" >> "$GITHUB_OUTPUT" ;;
            ARM64) echo "artifact=ci-image-arm64" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
        else
          echo "ref=${CI_IMAGE_REF:-ghcr.io/gtkx-org/gtkx-ci:latest}" >> "$GITHUB_OUTPUT"
        fi

    - name: Download fork image
      if: steps.source.outputs.artifact != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ steps.source.outputs.artifact }}
        path: ${{ runner.temp }}/gtkx-ci-image

    - name: Load fork image
      if: steps.source.outputs.artifact != ''
      shell: bash
      run: podman load --input "$RUNNER_TEMP/gtkx-ci-image/ci-image.tar"

    - name: Log in to GHCR
      if: steps.source.outputs.ref != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Pull image
      if: steps.source.outputs.ref != ''
      shell: bash
      env:
        REF: ${{ steps.source.outputs.ref }}
      run: |
        set -euo pipefail
        auth_file="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
        podman pull --authfile "$auth_file" "$REF"
        podman tag "$REF" localhost/gtkx-ci:local
