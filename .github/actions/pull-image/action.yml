name: Pull CI Image
description: Pull this run's CI image (CI_IMAGE_REF, built by the `image` job) and retag locally as gtkx-ci:local. When CI_IMAGE_REF is set but unpullable (e.g. a fork PR whose image job can't push to GHCR), build the current Dockerfile locally so its changes are still exercised; :latest is used only when no ref is given.

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

    - name: Pull image
      id: pull
      shell: bash
      run: |
        if [ -n "${CI_IMAGE_REF:-}" ]; then
          ref="$CI_IMAGE_REF"
        else
          ref="ghcr.io/gtkx-org/gtkx-ci:latest"
        fi
        if docker pull "$ref"; then
          docker tag "$ref" gtkx-ci:local
          echo "result=pulled" >> "$GITHUB_OUTPUT"
        else
          echo "result=missing" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx (fallback build)
      if: steps.pull.outputs.result == 'missing'
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Build image locally (fallback)
      if: steps.pull.outputs.result == 'missing'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .github/docker
        load: true
        tags: gtkx-ci:local
        cache-from: type=gha,scope=ci-image
