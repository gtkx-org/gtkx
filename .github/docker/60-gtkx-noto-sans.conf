<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Resolve the sans-serif generic to Noto Sans, matching the runtime the bindings
  are pinned against. Headless GTK renders text with GtkSettings "Sans 10", so
  the font fontconfig picks for "sans" sets every widget's text metrics. Without
  this the base image's default sans differs from the pinned runtime's, shifting
  layout by a pixel and tripping Adwaita size warnings the suite treats as
  failures.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
</fontconfig>
