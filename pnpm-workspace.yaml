packages:
  - .
  - packages/*
  - scripts
  - examples/*
  - "!examples/tutorial"
  - website

minimumReleaseAge: 0
trustPolicy: no-downgrade

verifyDepsBeforeRun: false

publicHoistPattern:
  - clipanion

trustPolicyExclude:
  - pino@9.14.0
  - semver@6.3.1

catalog:
  '@types/ejs': ^3.1.5
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@vitest/coverage-v8': ^4.1.10
  ejs: ^6.0.1
  react: ^19.2.8
  typescript: ^6.0.3
  vite: ^8.2.1
  vitest: ^4.1.10
  yaml: ^2.9.0
  zod: ^4.4.3

allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true

packageExtensions:
  '@emotion/utils':
    dependencies:
      '@emotion/sheet': ^1.4.0

peerDependencyRules:
  allowedVersions:
    '@napi-rs/cli>@emnapi/runtime': '*'

overrides:
  vite: ^8.2.1
  qs: ^6.15.3
  axios: ^1.19.0
  brace-expansion: ^5.0.9
