packages:
  - .
  - packages/*
  - scripts
  - examples/*
  - "!examples/tutorial"
  - website

minimumReleaseAge: 0
trustPolicy: no-downgrade

verifyDepsBeforeRun: false

publicHoistPattern:
  - clipanion

trustPolicyExclude:
  - pino@9.14.0
  - semver@6.3.1

catalog:
  '@types/ejs': ^3.1.5
  '@types/node': ^26.5.1
  '@types/react': ^19.3.0
  '@vitest/coverage-v8': ^5.0.1
  ejs: ^6.0.1
  react: ^19.3.0
  typescript: ^6.0.3
  vite: ^8.3.0
  vitest: ^5.0.1
  yaml: ^2.9.1
  zod: ^4.6.5

allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true

packageExtensions:
  '@emotion/utils':
    dependencies:
      '@emotion/sheet': ^1.4.0

peerDependencyRules:
  allowedVersions:
    '@napi-rs/cli>@emnapi/runtime': '*'
    '@nx/vitest>vitest': '*'

overrides:
  'nx>smol-toml': ^1.8.0
  vite: ^8.3.0
  'yaml@^2.0.0': ^2.9.1
  qs: ^6.16.0
  axios: ^1.20.0
  brace-expansion: ^5.0.12

patchedDependencies:
  '@react-navigation/core@7.22.1': patches/@react-navigation__core@7.22.1.patch
  '@react-navigation/routers@7.6.4': patches/@react-navigation__routers@7.6.4.patch
  '@types/react-reconciler@0.33.0': patches/@types__react-reconciler@0.33.0.patch
