packages:
  - .
  - packages/*
  - examples/*
  - "!examples/tutorial"
  - website

minimumReleaseAge: 0
trustPolicy: no-downgrade

publicHoistPattern:
  - clipanion

trustPolicyExclude:
  - pino@9.14.0

catalog:
  '@types/ejs': ^3.1.5
  '@types/node': ^26.1.1
  '@types/react': ^19.2.17
  '@vitest/coverage-v8': ^4.1.10
  ejs: ^6.0.1
  react: ^19.2.7
  typescript: ^7.0.2
  vite: ^8.1.5
  vitest: ^4.1.10
  zod: ^4.4.3

allowBuilds:
  '@swc/core': true
  esbuild: true

overrides:
  vite: ^8.1.5
  uuid: ^14.0.1
  '@docsearch/react': ^4.6.3
  qs: ^6.15.3
  js-yaml: ^4.3.0

patchedDependencies:
  dependency-cruiser: patches/dependency-cruiser.patch
