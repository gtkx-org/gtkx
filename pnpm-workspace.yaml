packages:
  - .
  - packages/*
  - packages/native/npm/*
  - examples/*

minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - pino@9.14.0 # transitive (verdaccio); long-published stable release flagged by the no-downgrade heuristic
  - semver@6.3.1 # legacy release pulled transitively; the same false positive vite excludes

catalog:
  '@types/node': ^26.0.0
  '@vitest/coverage-v8': ^4.1.9
  react: ^19.2.7
  typescript: ^6.0.3
  vite: ^8.0.16
  vitest: ^4.1.9

allowBuilds:
  '@swc/core': true
  esbuild: true

overrides:
  qs: ^6.15.2
  uuid: ^11.1.1
